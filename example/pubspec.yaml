name: flutter_document_reader_api_example
description: Demonstrates how to use the flutter_document_reader_api plugin.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  flutter:
    sdk: flutter
  flutter_document_reader_api:
    path: ../
  flutter_document_reader_core_fullauthrfid: 9.8.2902-nightly
  flutter_document_reader_btdevice:  9.7.110-nightly

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/
    - assets/images/
  uses-material-design: true
